name: Production deploy (reusable)

# Shared SDLC.AI production workflow. Wraps the DEPLOY_PROVIDER adapter contract
# (DEPLOY.*.md) and runs only from the default branch. An empty provider is N/A.
# An empty site_url disables production_verify only (recorded as N/A). Secrets are
# passed by name from the caller; never hardcode them.

on:
  workflow_call:
    inputs:
      deploy_provider:
        description: "cloudflare | DOCKER | '' (empty = N/A)"
        type: string
        default: ""
      site_url:
        description: Production URL (empty = production_verify is N/A)
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Guard default branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            echo "Production deploy runs only from the default branch (got ${GITHUB_REF})." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Production deploy (adapter dispatch)
        env:
          DEPLOY_PROVIDER: ${{ inputs.deploy_provider }}
          SITE_URL: ${{ inputs.site_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "${DEPLOY_PROVIDER}" in
            "")
              echo "DEPLOY_PROVIDER is empty -> production is N/A, nothing deployed."
              ;;
            cloudflare)
              echo "Adapter: follow DEPLOY-CF.*.md (standard production deploy from default branch)."
              echo "TODO(#89): implement provider deploy."
              ;;
            DOCKER)
              echo "Adapter: follow DEPLOY-DOCKER.*.md (production container)."
              echo "TODO(#89): implement provider deploy."
              ;;
            *)
              echo "Unknown DEPLOY_PROVIDER '${DEPLOY_PROVIDER}': BLOCKED, no improvised production action." >&2
              exit 1
              ;;
          esac

      - name: Production verify
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ]; then
            echo "production_verify: N/A (SITE_URL is not set)"
          else
            echo "production_verify: smoke-test ${SITE_URL} (TODO #89: real verification)."
          fi
