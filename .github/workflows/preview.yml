name: Preview deploy (reusable)

# Shared SDLC.AI preview workflow. Wraps the DEPLOY_PROVIDER adapter contract
# from the methodology (DEPLOY.*.md). An empty provider is a valid no-op (N/A):
# the workflow succeeds and deploys nothing. Secrets are passed by name from the
# caller via `secrets:`; never hardcode them.

on:
  workflow_call:
    inputs:
      deploy_provider:
        description: "cloudflare | DOCKER | '' (empty = N/A)"
        type: string
        default: ""
      preview_url_pattern:
        description: Pattern used only to validate the obtained preview URL
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
    outputs:
      preview_url:
        description: Verified preview URL (empty when N/A)
        value: ${{ jobs.preview.outputs.preview_url }}

jobs:
  preview:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preview deploy (adapter dispatch)
        id: deploy
        env:
          DEPLOY_PROVIDER: ${{ inputs.deploy_provider }}
          PREVIEW_URL_PATTERN: ${{ inputs.preview_url_pattern }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          case "${DEPLOY_PROVIDER}" in
            "")
              echo "DEPLOY_PROVIDER is empty -> preview is N/A, nothing deployed."
              echo "preview_url=" >> "$GITHUB_OUTPUT"
              ;;
            cloudflare)
              echo "::group::cloudflare preview adapter"
              echo "Adapter: follow DEPLOY-CF.*.md (wrangler/pages deploy of this HEAD)."
              echo "TODO(#89): implement provider deploy; must output a real, verified URL."
              echo "::endgroup::"
              echo "preview_url=" >> "$GITHUB_OUTPUT"
              ;;
            DOCKER)
              echo "::group::DOCKER preview adapter"
              echo "Adapter: follow DEPLOY-DOCKER.*.md (build image, run container for this HEAD)."
              echo "TODO(#89): implement provider deploy; must output a real, verified URL."
              echo "::endgroup::"
              echo "preview_url=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown DEPLOY_PROVIDER '${DEPLOY_PROVIDER}': BLOCKED, no improvised deploy." >&2
              exit 1
              ;;
          esac
